global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "victim-app"
    static_configs:
      - targets: ["victim-app:5001"]
    metrics_path: /metrics
    scrape_interval: 5s
